[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# L'URL reelle est injectee dynamiquement par alembic/env.py depuis
# backend.config.settings (variables d'environnement / .env). La valeur
# ci-dessous n'est qu'un filet de securite si env.py n'est pas execute.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/pfe_sarl_maroc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
