[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = "^alembic/versions/"

# chromadb (import différé, backend/rag/indexing.py) tire numpy en dépendance
# transitive dont les stubs (numpy >= 2.x, syntaxe PEP 695) sont incompatibles
# avec la cible python_version=3.11 de ce projet — sans rapport avec notre
# code. ignore_missing_imports ne couvre pas les erreurs de syntaxe dans un
# stub déjà trouvé, d'où ce skip explicite.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "chromadb", "chromadb.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/config/*", "*/__init__.py"]
